<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tiano Piles</title>
<meta name="theme-color" content="#111114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tiano Piles">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: quick, clean, arcade — nothing between you and the keys
   IDEA: a piano roll laid on its back, the score falling toward you in real rhythm
   PICTURE: the four-lane board itself, full screen; long notes are tall tiles
   COLOUR and TYPE: ivory white, piano black, one red accent; Big Shoulders for numbers
   LAYOUT: board fills the viewport, score floats at top, overlay card on game over */
:root{color-scheme:light;--red:#e8304a;--ink:#111114}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{font:16px/1.4 "Instrument Sans",system-ui,sans-serif;color:var(--ink)}
#board{position:fixed;inset:0;overflow:hidden;background:#fbfbf8 linear-gradient(90deg,transparent calc(25% - 1px),#e2e2e6 0 25%,transparent 0 calc(50% - 1px),#e2e2e6 0 50%,transparent 0 calc(75% - 1px),#e2e2e6 0 75%,transparent 0);touch-action:none}
.t{position:absolute;left:0;top:0;width:25%;height:25%;padding:1px;will-change:transform;display:none}
.t.on{display:block}
.t>i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#111114;box-shadow:inset 0 4px 0 rgba(255,255,255,.1);font:700 clamp(14px,5vw,22px) "Instrument Sans",sans-serif;font-style:normal;color:#fff}
.t.long>i{background-image:linear-gradient(90deg,transparent 47%,rgba(255,255,255,.16) 47% 53%,transparent 53%)}
.t.hit>i{background:#d8d8de;box-shadow:none}
.t.start>i{background:var(--red)}
.t.bad>i{background:var(--red);animation:blink .28s steps(1) infinite}
@keyframes blink{50%{background:#111114}}
#ver{position:fixed;right:8px;bottom:6px;font-size:11px;color:#b5b5bc;pointer-events:none}
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}
#score{font:900 64px/1 "Big Shoulders Display",Impact,sans-serif;color:var(--red);-webkit-text-stroke:3px #fff;paint-order:stroke fill}
#spd{margin-top:6px;display:inline-block;font:700 15px/1 "Instrument Sans",sans-serif;font-variant-numeric:tabular-nums;color:#fff;background:rgba(17,17,20,.82);padding:5px 10px;border-radius:99px}
#best{margin-top:6px;font-weight:700;font-size:13px;color:#8a8a93;font-variant-numeric:tabular-nums}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,10,14,.55);padding:24px}
#over.on{display:flex}
.card{width:min(320px,100%);background:#fff;border-radius:18px;padding:26px 22px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h2{font:700 15px/1 "Instrument Sans",sans-serif;color:#8a8a93}
.big{font:900 84px/1 "Big Shoulders Display",Impact,sans-serif;color:var(--ink);margin:8px 0 6px}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.nb{display:none;background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px}
.nb.on{display:block}
.rows{display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;font-size:15px;color:#55555e;border-top:1px solid #ececf0;padding-top:12px}
.rows b{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.card button{margin-top:18px;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:700 17px "Instrument Sans",sans-serif;cursor:pointer}
.card button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.tip{margin-top:12px;font-size:13px;color:#9a9aa3}
</style>
</head>
<body>
<div id="board"></div><div id="ver">v5</div>
<div id="hud"><div id="score">0</div><div id="spd">3.0 tiles/s</div><div id="best">Best 0 · 0.0 tiles/s</div></div>

const FREQ=new Float32Array(128);for(let m=0;m<128;m++)FREQ[m]=440*Math.pow(2,(m-69)/12);

// ---------- Audio ----------
let ac=null,master=null;
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{ac=new AC({latencyHint:'interactive'})}catch(e){ac=new AC()}
  master=ac.createGain();master.gain.value=.6;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  master.connect(comp);comp.connect(ac.destination);
}
// A plucked, harpsichord-like voice. Length follows the note's real duration at the current speed,
// so the music stays clean and in time however fast the tiles fall.
function voice(m,t,len,vel,bright){
  const f=FREQ[m],end=t+Math.max(.07,len),rel=Math.min(.12,len*.5+.03);
  const g=ac.createGain(),lp=ac.createBiquadFilter();
  lp.type='lowpass';lp.Q.value=.7;
  lp.frequency.setValueAtTime(Math.min(12000,f*bright),t);

  const stop=end+rel+.05;o1.start(t);o2.start(t);o1.stop(stop);o2.stop(stop);
}
function playTile(k,spd){
  if(!ac)return;
  const t0=ac.currentTime+.005,spr=1/spd,[,mel,bass]=SONG[k];
  for(const [m,o,d] of mel)voice(m,t0+o*spr,d*spr*.92,.34,7);
  for(const [m,o,d] of bass)voice(m,t0+o*spr,d*spr*.9,.24,5);
}
function playFail(){
  if(!ac)return;const t=ac.currentTime;
  const g=ac.createGain();g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);g.connect(master);
  for(const f of [92,98]){const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+.5);o.connect(g);o.start(t);o.stop(t+.62)}
}

// ---------- Tiles: index i -> song entry, start row, length, lane ----------
const tileK=i=>i%N;
const tileS=i=>Math.floor(i/N)*LOOP+STARTS[i%N];
const tileL=i=>SONG[i%N][0];
let lanes=[];
function lane(i){
  while(lanes.length<=i){
    const p=lanes.length?lanes[lanes.length-1]:-1;
    let l=Math.random()*4|0;if(l===p)l=(l+1+(Math.random()*3|0))%4;
    lanes.push(l);
  }
  return lanes[i];
}

// ---------- Board: a pool of tiles moved with GPU transforms ----------
const board=document.getElementById('board');
const POOL=14,els=[],elCls=[],elTxt=[],elLen=[];
for(let k=0;k<POOL;k++){const d=document.createElement('div');d.className='t';d.appendChild(document.createElement('i'));board.appendChild(d);els.push(d);elCls.push('t');elTxt.push('');elLen.push(1)}
const badCell=document.createElement('div');badCell.className='t bad';badCell.appendChild(document.createElement('i'));board.appendChild(badCell);
let W=0,H=0,laneW=0,rowH=0;
function resize(){W=board.clientWidth;H=board.clientHeight;laneW=W/4;rowH=H/4}
addEventListener('resize',resize);resize();

// ---------- State ----------
const BASE=3,INC=.012;   // rows (eighth notes) per second, and speed gained per tile
const $=id=>document.getElementById(id);
const scoreEl=$('score'),spdEl=$('spd'),bestEl=$('best'),over=$('over');
let best=0,bestSpd=0;
try{best=+localStorage.getItem('bourree-best')||0;bestSpd=+localStorage.getItem('bourree-best-speed')||0}catch(e){}
let state='ready',offset=0,target=0,next=0,failL=-1,failR=-1,failLen=1,overTimer=0,shownSpd=-1;
const speed=()=>BASE+next*INC;
function showBest(){bestEl.textContent='Best '+best+' · '+bestSpd.toFixed(1)+' tiles/s'}
function showSpd(){const r=Math.round(speed()*10);if(r!==shownSpd){shownSpd=r;spdEl.textContent=(r/10).toFixed(1)+' tiles/s'}}
function reset(){
  lanes=[];state='ready';offset=0;next=0;failL=failR=-1;
  scoreEl.textContent='0';over.classList.remove('on');showSpd();showBest();
}
function hit(){
  playTile(tileK(next),speed());
  next++;scoreEl.textContent=next;showSpd();
  if(state==='ready')state='play';
}
function lose(l,row,len,missed){
  state='over';failL=l;failR=row;failLen=len;playFail();
  target=missed?row-.4:offset;
  const v=speed(),newS=next>best,newV=v>bestSpd&&next>0;
  if(newS)best=next;if(newV)bestSpd=v;
  try{localStorage.setItem('bourree-best',best);localStorage.setItem('bourree-best-speed',bestSpd.toFixed(2))}catch(e){}
  showBest();
  $('fs').textContent=next;$('fBest').textContent=best;
  $('fSpd').textContent=v.toFixed(1)+' tiles/s';$('fBestSpd').textContent=bestSpd.toFixed(1)+' tiles/s';
  $('nbS').classList.toggle('on',newS&&best>0);$('nbV').classList.toggle('on',newV);
  clearTimeout(overTimer);overTimer=setTimeout(()=>{over.classList.add('on');$('again').focus({preventScroll:true})},800);
}
function tileAt(row){              // which tile covers this row (searching near the next tile)
  for(let i=Math.max(0,next-8);i<next+16;i++){const s=tileS(i);if(s>row)return -1;if(row<s+tileL(i))return i}
  return -1;
}
function press(l,y){
  initAudio();
  if(state==='over')return;
  if(l===lane(next)&&tileS(next)-offset<4.05){hit();return}
  if(state==='ready')return;
  const row=offset+(H-y)/rowH,i=tileAt(row);
  if(i>=0&&i<next&&lane(i)===l)return;     // tapping a tile you already played is harmless
  if(i>=0&&lane(i)===l)lose(l,tileS(i),tileL(i),false);
  else lose(l,Math.floor(row),1,false);
}

// ---------- Input ----------
board.addEventListener('pointerdown',e=>{
  e.preventDefault();if(!laneW)resize();
  press(Math.min(3,Math.max(0,(e.clientX/laneW)|0)),e.clientY);
},{passive:false});
const KEYS={KeyD:0,KeyF:1,KeyJ:2,KeyK:3,Digit1:0,Digit2:1,Digit3:2,Digit4:3};
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code in KEYS){e.preventDefault();press(KEYS[e.code],H-rowH*.5)}
  else if((e.code==='Space'||e.code==='Enter')&&state==='over'&&over.classList.contains('on')){e.preventDefault();reset()}
});
$('again').addEventListener('click',()=>{initAudio();reset()});
['touchstart','touchmove','gesturestart','dblclick'].forEach(ev=>document.addEventListener(ev,e=>{if(board.contains(e.target))e.preventDefault()},{passive:false}));

// ---------- Loop ----------
let last=performance.now();
function frame(t){
  const dt=Math.max(0,Math.min((t-last)/1000,.05));last=t;
  if(state==='play'){
    offset+=speed()*dt;
    if(offset>tileS(next)+1)lose(lane(next),tileS(next),tileL(next),true);
  }else if(state==='over'){
    offset+=(target-offset)*Math.min(1,dt*12);
  }
  draw();
  requestAnimationFrame(frame);
}
function place(d,l,s,len){d.style.transform='translate3d('+(l*laneW).toFixed(1)+'px,'+(H-(s+len-offset)*rowH).toFixed(1)+'px,0)'}
function draw(){
  let k=0;
  for(let i=Math.max(0,next-8);k<POOL;i++){
    const s=tileS(i),len=tileL(i);
    if(s>offset+4.2)break;
    if(s+len<offset-.1)continue;
    let cls=len>1?'t on long':'t on';
    if(state==='over'&&s===failR&&failL===lane(i))cls+=' bad';
    else if(i<next)cls+=' hit';
    else if(i===0&&state==='ready')cls+=' start';
    const d=els[k],txt=(i===0&&state==='ready')?'START':'';
    if(elCls[k]!==cls){elCls[k]=cls;d.className=cls}
    if(elTxt[k]!==txt){elTxt[k]=txt;d.firstChild.textContent=txt}
    if(elLen[k]!==len){elLen[k]=len;d.style.height=(len*25)+'%'}
    place(d,lane(i),s,len);k++;
  }
  for(;k<POOL;k++)if(elCls[k]!=='t'){elCls[k]='t';els[k].className='t'}
  const i=state==='over'?tileAt(failR+.01):-1;
  if(state==='over'&&failR>=0&&!(i>=0&&lane(i)===failL)){
    badCell.style.display='block';badCell.style.height=(failLen*25)+'%';place(badCell,failL,failR,failLen);
  }else badCell.style.display='none';
}
reset();
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
}
</script>
