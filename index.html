<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tiano Piles</title>
<meta name="theme-color" content="#111114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tiano Piles">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: quick, clean, arcade — nothing between you and the keys
   IDEA: a piano keyboard laid on its back, keys falling toward you
   PICTURE: the four-lane board itself, full screen
   COLOUR and TYPE: ivory white, piano black, one red accent; Big Shoulders for numbers
   LAYOUT: canvas fills the viewport, score floats at top, overlay card on game over */
:root{color-scheme:light;--red:#e8304a;--ink:#111114}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{font:16px/1.4 "Instrument Sans",system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100vw;height:100dvh;display:block}
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}
#score{font:900 64px/1 "Big Shoulders Display",Impact,sans-serif;color:var(--red);-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:0 2px 0 rgba(0,0,0,.08)}
#tps{margin-top:6px;display:inline-block;font:700 15px/1 "Instrument Sans",sans-serif;font-variant-numeric:tabular-nums;color:#fff;background:rgba(17,17,20,.82);padding:5px 10px;border-radius:99px}
#best{margin-top:6px;font-weight:700;font-size:13px;color:#8a8a93}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,10,14,.55);padding:24px}
#over.on{display:flex}
.card{width:min(320px,100%);background:#fff;border-radius:18px;padding:28px 24px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h2{font:700 15px/1 "Instrument Sans",sans-serif;color:#8a8a93}
.big{font:900 88px/1 "Big Shoulders Display",Impact,sans-serif;color:var(--ink);margin:8px 0 4px}
.nb{display:none;margin:0 auto 6px;width:max-content;background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px}
.nb.on{display:block}
.bl{color:#6b6b74;font-size:15px}
.card button{margin-top:20px;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:700 17px "Instrument Sans",sans-serif;cursor:pointer}
.card button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.tip{margin-top:12px;font-size:13px;color:#9a9aa3}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="score">0</div><div id="tps">0.0 taps/s</div><div id="best">Best 0</div></div>
<div id="over"><div class="card">
  <h2>Score</h2>
  <div class="big" id="fs">0</div>
  <div class="nb" id="nb">New best!</div>
  <div class="bl" id="fb">Best 0</div>
  <div class="bl" id="fp">Peak 0.0 taps/s</div>
  <button id="again">Play again</button>
  <div class="tip">Bach · Bourrée in E minor, BWV 996</div>
</div></div>
<script>
{
// ---------- Music: Bach, Bourrée in E minor (melody line), MIDI numbers ----------
const A=[64,66, 67,66,64,63,64,66, 59,61,63,64,62,60, 59,57,55,54,55,57, 59,57,55,54,52];
const A2=[64,66, 67,66,64,63,64,66, 59,61,63,64,62,60, 59,57,55,54,55,57, 59,62,57,55];
const B=[67,69, 71,69,67,66,67,69, 62,64,66,67,66,64, 63,64,66,67,69,66, 67,66,64,63,64];
const SONG=[...A,...A2,...B,...A];
const FREQ=new Float32Array(128);for(let m=0;m<128;m++)FREQ[m]=440*Math.pow(2,(m-69)/12);

// ---------- Audio ----------
let ac=null,master=null;
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{ac=new AC({latencyHint:'interactive'})}catch(e){ac=new AC()}
  master=ac.createGain();master.gain.value=.55;
  const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
}
function playNote(m){
  if(!ac)return;const t=ac.currentTime,f=FREQ[m];
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.004);
  g.gain.exponentialRampToValueAtTime(.18,t+.15);g.gain.exponentialRampToValueAtTime(.0005,t+1.3);g.connect(master);
  const o1=ac.createOscillator();o1.type='triangle';o1.frequency.value=f;o1.connect(g);
  const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=f*2;
  const g2=ac.createGain();g2.gain.value=.25;o2.connect(g2);g2.connect(g);
  const o3=ac.createOscillator();o3.type='sine';o3.frequency.value=f/2;
  const g3=ac.createGain();g3.gain.value=.35;o3.connect(g3);g3.connect(g);
  o1.start(t);o2.start(t);o3.start(t);o1.stop(t+1.35);o2.stop(t+1.35);o3.stop(t+1.35);
}
function playFail(){
  if(!ac)return;const t=ac.currentTime;
  const g=ac.createGain();g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);g.connect(master);
  for(const f of [92,98]){const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+.5);o.connect(g);o.start(t);o.stop(t+.62)}
}

// ---------- Canvas ----------
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false,desynchronized:true});
let W=0,H=0,laneW=0,rowH=0;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);laneW=W/4;rowH=H/4;
}
addEventListener('resize',resize);resize();

// ---------- State ----------
const BASE=2.6,INC=.016;   // rows per second, and speed gained per tile
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const over=document.getElementById('over'),fs=document.getElementById('fs'),fb=document.getElementById('fb'),nb=document.getElementById('nb');
let best=0;try{best=+localStorage.getItem('bourree-best')||0}catch(e){}
bestEl.textContent='Best '+best;

// taps per second: hits in the last WIN ms, shown live; peak kept per run
const tpsEl=document.getElementById('tps'),fp=document.getElementById('fp');
const WIN=1500,taps=new Float64Array(64);let tHead=0,tCount=0,peak=0,lastTpsDraw=0,shownTps=-1;
function currentTps(now){
  let n=0;for(let k=0;k<tCount;k++){if(now-taps[(tHead-1-k+64)%64]<=WIN)n++;else break}
  return n*1000/WIN;
}
function showTps(v){const r=Math.round(v*10);if(r!==shownTps){shownTps=r;tpsEl.textContent=(r/10).toFixed(1)+' taps/s'}}
let lanes=[],state='ready',offset=0,target=0,next=0,noteIdx=0,failL=-1,failR=-1,failT=0,overTimer=0;
function lane(i){
  while(lanes.length<=i){
    let l=Math.random()*4|0;const p=lanes[lanes.length-1];
    if(l===p&&Math.random()<.7)l=(l+1+(Math.random()*3|0))%4;
    lanes.push(l);
  }
  return lanes[i];
}
function reset(){
  lanes=[];state='ready';offset=0;next=0;noteIdx=0;failL=failR=-1;
  scoreEl.textContent='0';over.classList.remove('on');
  tHead=tCount=0;peak=0;showTps(0);
}
function hit(){
  playNote(SONG[noteIdx++%SONG.length]);
  const now=performance.now();taps[tHead]=now;tHead=(tHead+1)%64;if(tCount<64)tCount++;
  const v=currentTps(now);if(v>peak)peak=v;
  next++;scoreEl.textContent=next;
  if(state==='ready')state='play';
}
function lose(l,r,missed){
  state='over';failL=l;failR=r;failT=performance.now();playFail();
  target=missed?r-.35:offset;
  const isBest=next>best;
  if(isBest){best=next;try{localStorage.setItem('bourree-best',best)}catch(e){}}
  bestEl.textContent='Best '+best;
  fs.textContent=next;fb.textContent='Best '+best;fp.textContent='Peak '+peak.toFixed(1)+' taps/s';nb.classList.toggle('on',isBest&&best>0);
  clearTimeout(overTimer);overTimer=setTimeout(()=>{over.classList.add('on');document.getElementById('again').focus({preventScroll:true})},800);
}
function press(l,y){
  initAudio();
  if(state==='over')return;
  const tl=lane(next);
  if(l===tl&&next-offset<4.05){hit();return}
  if(state==='ready')return;
  const r=Math.floor(offset+(H-y)/rowH);
  if(r<next&&lane(r)===l)return;      // tapping an already-played tile is harmless
  lose(l,r,false);
}

// ---------- Input ----------
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  press(Math.min(3,Math.max(0,(e.clientX/laneW)|0)),e.clientY);
},{passive:false});
const KEYS={KeyD:0,KeyF:1,KeyJ:2,KeyK:3,Digit1:0,Digit2:1,Digit3:2,Digit4:3};
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code in KEYS){e.preventDefault();press(KEYS[e.code],H-rowH*.5)}
  else if((e.code==='Space'||e.code==='Enter')&&state==='over'&&over.classList.contains('on')){e.preventDefault();reset()}
});
document.getElementById('again').addEventListener('click',()=>{initAudio();reset()});
['touchstart','touchmove','gesturestart','dblclick'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target===cv)e.preventDefault()},{passive:false}));

// ---------- Loop ----------
let last=performance.now();
function frame(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  if(state==='play'){
    offset+=(BASE+next*INC)*dt;
    if(offset>next+1)lose(lane(next),next,true);
    if(t-lastTpsDraw>100){lastTpsDraw=t;showTps(currentTps(t))}
  }else if(state==='over'){
    offset+=(target-offset)*Math.min(1,dt*12);
  }
  draw(t);
  requestAnimationFrame(frame);
}
function draw(t){
  ctx.fillStyle='#fbfbf8';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#e2e2e6';
  for(let i=1;i<4;i++)ctx.fillRect(Math.round(i*laneW),0,1,H);
  const first=Math.max(0,Math.floor(offset)),lastR=Math.ceil(offset+4);
  const blink=state==='over'&&((t-failT)/140|0)%2===0;
  for(let i=first;i<=lastR;i++){
    const yb=H-(i-offset)*rowH,yt=yb-rowH,x=lane(i)*laneW;
    if(i===failR&&state==='over'&&failL===lane(i)){
      ctx.fillStyle=blink?'#e8304a':'#111114';ctx.fillRect(x+1,yt+1,laneW-2,rowH-2);continue;
    }
    if(i<next){
      ctx.fillStyle='#d8d8de';ctx.fillRect(x+1,yt+1,laneW-2,rowH-2);
    }else{
      ctx.fillStyle=(i===0&&state==='ready')?'#e8304a':'#111114';
      ctx.fillRect(x+1,yt+1,laneW-2,rowH-2);
      ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(x+1,yt+1,laneW-2,4);
      if(i===0&&state==='ready'){
        ctx.fillStyle='#fff';ctx.font='700 '+Math.round(Math.min(laneW*.22,22))+'px "Instrument Sans",sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('START',x+laneW/2,yt+rowH/2);
      }
    }
  }
  // wrong-lane tap: show the empty cell flashing red
  if(state==='over'&&failR>=0&&failL!==lane(failR)){
    const yb=H-(failR-offset)*rowH;
    ctx.fillStyle=blink?'#e8304a':'rgba(232,48,74,.35)';
    ctx.fillRect(failL*laneW+1,yb-rowH+1,laneW-2,rowH-2);
  }
}
reset();
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
